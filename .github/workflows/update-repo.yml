name: Update APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true
        
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y reprepro gnupg2
        
    - name: Setup GPG
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      run: |
        ruby <<'RUBY'
        require 'open3'
        require 'fileutils'
        
        gpg_key = ENV['GPG_PRIVATE_KEY']
        passphrase = ENV['GPG_PASSPHRASE']
        key_id = ENV['GPG_KEY_ID']
        
        # Import GPG key
        Open3.popen3('gpg', '--import', '--batch') do |stdin, stdout, stderr, wait_thr|
          stdin.write(gpg_key)
          stdin.close
          puts stderr.read
        end
        
        # Configure GPG
        gnupg_dir = File.expand_path('~/.gnupg')
        FileUtils.mkdir_p(gnupg_dir)
        
        File.write("#{gnupg_dir}/gpg.conf", <<~CONF)
          use-agent
          pinentry-mode loopback
          batch
          yes
        CONF
        
        File.write("#{gnupg_dir}/gpg-agent.conf", <<~CONF)
          allow-loopback-pinentry
          max-cache-ttl 7200
          default-cache-ttl 7200
        CONF
        
        # Reload agent
        system('gpg-connect-agent', 'reloadagent', '/bye')
        
        # Test signing
        Open3.popen3('gpg', '--batch', '--yes', '--passphrase', passphrase,
                     '--pinentry-mode', 'loopback', '--default-key', key_id,
                     '--clearsign') do |stdin, stdout, stderr, wait_thr|
          stdin.write('test')
          stdin.close
          result = stdout.read
          exit 1 unless wait_thr.value.success?
        end
        
        # Preset passphrase
        keygrip = `gpg --with-keygrip --list-secret-keys "#{key_id}"`.match(/Keygrip = (\S+)/)&.[](1)
        if keygrip
          Open3.popen3('/usr/lib/gnupg2/gpg-preset-passphrase', '--preset', keygrip) do |stdin, stdout, stderr, wait_thr|
            stdin.write(passphrase)
            stdin.close
          end
        end
        
        puts "✅ GPG setup complete"
        RUBY
        
    - name: Verify reprepro configuration
      run: |
        ruby <<'RUBY'
        unless File.exist?('conf/distributions')
          puts "❌ Error: conf/distributions not found"
          exit 1
        end
        
        puts "Using existing conf/distributions:"
        puts File.read('conf/distributions')
        RUBY
        
    - name: Download packages from ALL releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        ruby <<'RUBY'
        require 'net/http'
        require 'json'
        require 'fileutils'
        require 'uri'
        
        token = ENV['GITHUB_TOKEN']
        repo = ENV['GITHUB_REPOSITORY']
        
        FileUtils.mkdir_p('incoming')
        
        puts "📦 Fetching all releases..."
        
        uri = URI("https://api.github.com/repos/#{repo}/releases?per_page=100")
        request = Net::HTTP::Get.new(uri)
        request['Authorization'] = "Bearer #{token}"
        request['Accept'] = 'application/vnd.github+json'
        
        response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
          http.request(request)
        end
        
        unless response.is_a?(Net::HTTPSuccess)
          puts "❌ Failed to fetch releases"
          puts response.body
          exit 1
        end
        
        releases = JSON.parse(response.body)
        File.write('releases.json', JSON.pretty_generate(releases))
        
        puts "✅ Found #{releases.length} releases"
        
        # Download all .deb files
        deb_count = 0
        releases.each do |release|
          next unless release['assets']
          
          release['assets'].each do |asset|
            next unless asset['name'].end_with?('.deb')
            
            output_path = "incoming/#{asset['name']}"
            expected_size = asset['size']
            
            puts "Downloading #{asset['name']} from #{release['tag_name']} (#{expected_size} bytes)..."
            
            uri = URI(asset['browser_download_url'])
            Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
              request = Net::HTTP::Get.new(uri)
              request['Authorization'] = "Bearer #{token}" if asset['browser_download_url'].include?('github.com')
              
              http.request(request) do |response|
                unless response.is_a?(Net::HTTPSuccess)
                  puts "⚠️  Failed to download #{asset['name']}: #{response.code} #{response.message}"
                  next
                end
                
                File.open(output_path, 'wb') do |file|
                  response.read_body { |chunk| file.write(chunk) }
                end
              end
            end
            
            # Verify file size
            actual_size = File.size(output_path)
            if actual_size != expected_size
              puts "⚠️  Size mismatch for #{asset['name']}: expected #{expected_size}, got #{actual_size}"
              File.delete(output_path)
              next
            end
            
            # Verify it's a valid deb file by checking magic bytes
            File.open(output_path, 'rb') do |file|
              magic = file.read(21)
              unless magic && magic.start_with?('!<arch>')
                puts "⚠️  Invalid .deb file format for #{asset['name']}"
                File.delete(output_path)
                next
              end
            end
            
            puts "✅ Downloaded and verified #{asset['name']}"
            deb_count += 1
          end
        end
        
        puts "✅ Downloaded #{deb_count} .deb file(s) from all releases"
        Dir.glob('incoming/*.deb').each { |f| puts "  #{File.basename(f)} (#{File.size(f)} bytes)" }
        RUBY
        
    - name: Extract package metadata and build filename mapping
      run: |
        ruby <<'RUBY'
        require 'fileutils'
        require 'open3'
        
        puts "📋 Extracting package control information..."
        
        FileUtils.mkdir_p('/tmp/package-info')
        mapping_file = File.open('/tmp/package-info/mapping.txt', 'w')
        
        Dir.glob('incoming/*.deb').each do |deb_path|
          original_filename = File.basename(deb_path)
          
          puts "Processing: #{original_filename}"
          
          # Extract all control information at once
          control_output, status = Open3.capture2('dpkg-deb', '-f', deb_path)
          
          unless status.success?
            puts "⚠️  Warning: Failed to extract metadata from #{original_filename}"
            next
          end
          
          # Parse the control file output
          fields = {}
          control_output.each_line do |line|
            if line =~ /^(\w+(?:-\w+)*): (.+)$/
              fields[$1] = $2.strip
            end
          end
          
          pkg_name = fields['Package']
          pkg_version = fields['Version']
          pkg_arch = fields['Architecture']
          
          if pkg_name.nil? || pkg_version.nil? || pkg_arch.nil?
            puts "⚠️  Warning: Missing required fields in #{original_filename}"
            puts "    Package: '#{pkg_name}', Version: '#{pkg_version}', Architecture: '#{pkg_arch}'"
            next
          end
          
          # Debian pool filename format
          pool_filename = "#{pkg_name}_#{pkg_version}_#{pkg_arch}.deb"
          
          # Determine pool path
          first_letter = pkg_name.start_with?('lib') ? pkg_name[0..3] : pkg_name[0]
          pool_path = "pool/main/#{first_letter}/#{pkg_name}/#{pool_filename}"
          
          mapping_file.puts "#{original_filename}|#{pool_filename}|#{pool_path}|#{pkg_name}|#{pkg_version}|#{pkg_arch}"
          
          puts "  #{original_filename} -> #{pool_filename}"
        end
        
        mapping_file.close
        puts "✅ Package metadata extracted"
        puts
        puts "Mapping file contents:"
        puts File.read('/tmp/package-info/mapping.txt')
        RUBY
        
    - name: Export public key
      env:
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      run: |
        ruby <<'RUBY'
        require 'fileutils'
        
        key_id = ENV['GPG_KEY_ID']
        
        FileUtils.mkdir_p('public/dists')
        
        `gpg --armor --export "#{key_id}" > public/dists/public-key.asc`
        FileUtils.cp('public/dists/public-key.asc', 'public/KEY.gpg')
        
        # Verify the key
        result = system('gpg', '--dry-run', '--import', 'public/dists/public-key.asc', 
                       out: File::NULL, err: File::NULL)
        
        if result
          puts "✅ Public key exported successfully"
          system('gpg', '--show-keys', 'public/dists/public-key.asc')
        else
          puts "❌ Failed to export public key"
          exit 1
        end
        RUBY
        
    - name: Update repository
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      run: |
        ruby <<'RUBY'
        require 'fileutils'
        
        distribution = 'alpha'
        
        puts "📦 Adding packages to repository..."
        Dir.glob('incoming/*.deb').each do |deb_path|
          puts "Adding: #{File.basename(deb_path)}"
          unless system('reprepro', '-b', '.', '-V', 'includedeb', distribution, deb_path)
            puts "⚠️ Failed to add #{File.basename(deb_path)}"
          end
        end
        
        puts "🔐 Exporting and signing repository..."
        system('reprepro', '-b', '.', 'export', distribution)
        
        puts "📋 Repository contents:"
        system('reprepro', '-b', '.', 'list', distribution)
        
        # Copy repository metadata to public
        FileUtils.cp_r('dists', 'public/')
        RUBY
        
    - name: Generate release map JSON
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        ruby <<'RUBY'
        require 'json'
        require 'time'
        require 'fileutils'
        
        puts "📋 Generating release map..."
        
        # Read releases data
        releases = JSON.parse(File.read('releases.json'))
        
        # Build release info map
        release_info_map = {}
        releases.each do |release|
          next unless release['assets']
          
          release['assets'].each do |asset|
            release_info_map[asset['name']] = {
              'release' => release['tag_name'],
              'downloadUrl' => asset['browser_download_url'],
              'size' => asset['size']
            }
          end
        end
        
        # Read package mapping
        packages = {}
        File.readlines('/tmp/package-info/mapping.txt').each do |line|
          parts = line.strip.split('|')
          original_name, pool_filename, pool_path, pkg_name, version, arch = parts
          
          release_data = release_info_map[original_name]
          next unless release_data
          
          packages[pool_filename] = {
            'release' => release_data['release'],
            'originalAssetName' => original_name,
            'poolPath' => pool_path,
            'packageName' => pkg_name,
            'version' => version,
            'architecture' => arch,
            'downloadUrl' => release_data['downloadUrl'],
            'size' => release_data['size']
          }
        end
        
        # Build final output
        output = {
          '_metadata' => {
            'generated_at' => Time.now.utc.iso8601,
            'repository' => ENV['GITHUB_REPOSITORY'],
            'total_releases' => releases.length,
            'note' => 'Pool filenames follow Debian convention: package_version_arch.deb'
          },
          'packages' => packages
        }
        
        FileUtils.mkdir_p('public')
        File.write('public/release-map.json', JSON.pretty_generate(output))
        
        puts "✅ Release map generated: public/release-map.json"
        puts "📦 Total packages mapped: #{packages.length}"
        puts "📄 Release map preview:"
        puts JSON.pretty_generate(output['_metadata'])
        puts
        puts JSON.pretty_generate(packages.first(2).to_h)
        RUBY
    
    - name: Create additional metadata
      run: |
        ruby <<'RUBY'
        require 'json'
        require 'fileutils'
        
        puts "📋 Creating additional metadata files..."
        
        releases = JSON.parse(File.read('releases.json'))
        
        # Create releases.json with detailed information
        releases_output = releases.map do |release|
          next unless release['assets']
          
          {
            'tag' => release['tag_name'],
            'name' => release['name'],
            'published_at' => release['published_at'],
            'prerelease' => release['prerelease'],
            'draft' => release['draft'],
            'packages' => release['assets'].select { |a| a['name'].end_with?('.deb') }.map do |asset|
              {
                'name' => asset['name'],
                'size' => asset['size'],
                'download_count' => asset['download_count'],
                'created_at' => asset['created_at'],
                'browser_download_url' => asset['browser_download_url']
              }
            end
          }
        end.compact
        
        File.write('public/releases.json', JSON.pretty_generate(releases_output))
        
        # Create index.html
        html = <<~HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Noraneko APT Repository</title>
              <style>
                  body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 0 20px; }
                  pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; }
                  code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
                  h1 { color: #333; }
                  .section { margin: 30px 0; }
              </style>
          </head>
          <body>
              <h1>Noraneko APT Repository</h1>
              <div class="section">
                  <h2>Setup Instructions</h2>
                  <p>Add this repository to your system:</p>
                  <pre><code>curl -fsSL https://apt.yourdomain.com/KEY.gpg | sudo gpg --dearmor -o /usr/share/keyrings/noraneko.gpg
          echo "deb [signed-by=/usr/share/keyrings/noraneko.gpg] https://apt.yourdomain.com alpha main" | sudo tee /etc/apt/sources.list.d/noraneko.list
          sudo apt update</code></pre>
              </div>
              <div class="section">
                  <h2>Available Resources</h2>
                  <ul>
                      <li><a href="/release-map.json">Release Map</a> - Package to release mapping (includes pool paths)</li>
                      <li><a href="/releases.json">Releases</a> - Detailed release information</li>
                      <li><a href="/KEY.gpg">GPG Key</a> - Repository signing key</li>
                  </ul>
              </div>
              <div class="section">
                  <h2>How it works</h2>
                  <p>This repository uses Cloudflare Workers to proxy .deb files from GitHub releases. 
                  When APT requests a package from the pool (e.g., <code>pool/main/n/noraneko-alpha/noraneko-alpha_0.2.0~build1_amd64.deb</code>),
                  the worker maps it to the original GitHub release asset and serves it directly.</p>
              </div>
          </body>
          </html>
        HTML
        
        File.write('public/index.html', html)
        
        puts "✅ Metadata files created"
        Dir.glob('public/*').each { |f| puts "  #{File.basename(f)} (#{File.size(f)} bytes)" }
        RUBY
        
    - name: Deploy to Cloudflare Workers
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "github-actions"
        git add public/ dists/ db/ pool/ 2>/dev/null || true
        git commit -m "Update APT repository [skip ci]" || echo "No changes to commit"
        git push || echo "Nothing to push"
